name: Check portfolio
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.repository == 'vicreedart/VicReedArt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_MODE: demo
      DEPLOYMENT_ENV: preview
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run content
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir .deploy --env preview
